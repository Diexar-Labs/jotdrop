name: jotdrop-mcp

on:
  push:
    branches: [main]
    paths:
      - "cloud/mcp/**"
      - "cloud/shared/**"
      - "cloud/web/note.mjs"
      - "cloud/server.mjs"
      - ".github/workflows/mcp.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloud/mcp/**"
      - "cloud/shared/**"
      - "cloud/web/note.mjs"
      - "cloud/server.mjs"
      - ".github/workflows/mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The tests start the real cloud server, which needs Node 24 (node:crypto argon2); the servers run 24.
        node: ["24", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/mcp/package-lock.json

      # The in-process cloud in the tests is cloud/server.mjs, which needs the root dependencies.
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Core tests (no SDK, against an in-process cloud)
        run: node --test "cloud/mcp/src/*.test.mjs" "cloud/shared/ai/*.test.mjs" cloud/shared/hashtags.test.mjs

      - name: MCP layer, bundle and audit (check:mcp)
        run: npm run check:mcp

  # The lowest Node in "engines": the bundle itself (without the cloud server) starts and runs.
  node22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build and start the bundle
        working-directory: cloud/mcp
        env:
          JOTDROP_MCP_HOME: ${{ runner.temp }}/jotdrop-mcp-home
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test "$(node dist/jotdrop-mcp.mjs --version)" = "$(node -p "require('./package.json').version")"
          node dist/jotdrop-mcp.mjs --help > /dev/null
          node dist/jotdrop-mcp.mjs status > status.txt || true
          grep -q "is not connected" status.txt

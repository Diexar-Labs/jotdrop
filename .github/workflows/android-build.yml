name: Build and Release JotDrop

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "[0-9]*"
    paths:
      - "android/**"
      - "src/**"
      - "manifest.json"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "esbuild.config.mjs"
      - "scripts/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "manifest.json"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "esbuild.config.mjs"
      - "scripts/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Verify the immutable commit that triggered this run. A later push may
      # move origin/main while this build is still running.
      JOTDROP_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install plugin dependencies
        working-directory: .
        run: npm ci

      - name: Build plugin assets
        working-directory: .
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: npm run verify:tag -- "${GITHUB_REF_NAME}"

      - name: Validate Android compilation on pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Verify release source
        if: github.event_name != 'pull_request'
        working-directory: .
        run: npm run verify:release

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage Android release assets
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p artifacts/plugin
          cp app/build/outputs/apk/release/app-release.apk artifacts/jotdrop.apk
          cp ../main.js ../manifest.json ../styles.css artifacts/plugin/
          node ../scripts/write-build-info.mjs artifacts/BUILD-INFO.txt

      - name: Upload verified build artifacts
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: jotdrop-release
          path: |
            android/artifacts/jotdrop.apk
            android/artifacts/plugin/main.js
            android/artifacts/plugin/manifest.json
            android/artifacts/plugin/styles.css
            android/artifacts/BUILD-INFO.txt
          retention-days: 30

      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" android/artifacts/jotdrop.apk android/artifacts/plugin/main.js android/artifacts/plugin/manifest.json android/artifacts/plugin/styles.css android/artifacts/BUILD-INFO.txt --clobber
            gh release edit "${GITHUB_REF_NAME}" --latest
          else
            gh release create "${GITHUB_REF_NAME}" android/artifacts/jotdrop.apk android/artifacts/plugin/main.js android/artifacts/plugin/manifest.json android/artifacts/plugin/styles.css android/artifacts/BUILD-INFO.txt --verify-tag --generate-notes --latest
          fi

      - name: Publish Obsidian plugin release
        if: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
            gh release edit "${GITHUB_REF_NAME}" --latest=false
          else
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --verify-tag --generate-notes --latest=false
          fi

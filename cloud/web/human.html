<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JotDrop person check</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="human-page">
    <img src="/logo.svg" alt="" width="48" height="48">
    <h1>One quick check</h1>
    <p>Confirm that you are a person, not a script. Then your new JotDrop account continues in the app.</p>
    <div id="human-check" class="human-check"></div>
    <p id="human-message" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="/human.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JotDrop Web Clipper — Background connection</title>
  <link rel="stylesheet" href="../popup/popup.css" />
  <style>
    body { width: auto; max-width: 520px; padding: 24px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .lead { font-size: 13px; color: var(--fg); margin: 0 0 4px; }
    .hint { font-size: 12px; color: var(--muted); margin: 4px 0 12px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input[type="text"] { flex: 1; font-family: monospace; }
    details { margin: 16px 0; }
    summary { cursor: pointer; font-size: 13px; color: var(--muted); }
    summary:hover { color: var(--fg); }
  </style>
</head>
<body>
  <h1>Background connection</h1>
  <p class="lead">
    No setup is required — the clipper works out of the box by opening Obsidian for every save.
    Connecting below is <strong>optional</strong>: it lets saves run quietly in the background
    without bringing Obsidian to the foreground.
  </p>

  <label class="field">
    <span>Token</span>
    <div class="row">
      <input id="token" type="text" placeholder="Paste token from plugin settings" />
      <button id="paste" class="btn-secondary" type="button">Paste</button>
    </div>
    <p class="hint">In Obsidian → JotDrop settings → "Web clipper" → Enable clip server, then copy the token.</p>
  </label>

  <details>
    <summary>Advanced</summary>
    <label class="field">
      <span>Plugin port</span>
      <input id="port" type="number" min="1024" max="65535" value="27124" />
      <p class="hint">Matches "Port" in the plugin settings. Default is 27124.</p>
    </label>
  </details>

  <div class="row" style="margin-top: 16px;">
    <button id="saveTest" class="btn-primary" type="button">Save and test connection</button>
  </div>

  <p id="status" class="hint" aria-live="polite" style="margin-top: 12px;"></p>

  <script src="options.js"></script>
</body>
</html>
